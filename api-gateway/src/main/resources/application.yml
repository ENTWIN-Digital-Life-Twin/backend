spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Path-preserving routes — frontend keeps existing /api/... paths.
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: planning-service
              uri: ${PLANNING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/tasks/**,/api/v1/task-categories/**,/api/v1/planning/**,/api/v1/events/**,/api/v1/dashboard/**
            - id: wellness-service
              uri: ${WELLNESS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/wellness/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/reminders/**,/api/v1/notifications/**
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/v1/ai/**

server:
  port: ${GATEWAY_PORT:8080}

# Must match auth-service JWT_SECRET so access tokens verify correctly.
jwt:
  secret: ${JWT_SECRET:LocalDevOnlyChangeMe_NeedAtLeast32Bytes!!}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

gateway:
  rate-limit:
    auth:
      requests: ${GATEWAY_AUTH_RATE_LIMIT_REQUESTS:20}
      window-seconds: ${GATEWAY_AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: api-gateway
    description: ENTWIN Digital Life Twin API Gateway
    version: 0.1.0

logging:
  level:
    com.digitallifetwin.gateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
