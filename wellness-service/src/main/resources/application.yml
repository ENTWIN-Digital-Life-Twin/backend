spring:
  application:
    name: wellness-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${WELLNESS_DB_NAME:dlt_wellness}
    username: ${DB_USERNAME:dlt}
    password: ${DB_PASSWORD:dlt}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8083}

# Must match auth-service JWT_SECRET so access tokens verify correctly.
jwt:
  secret: ${JWT_SECRET:LocalDevOnlyChangeMe_NeedAtLeast32Bytes!!}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Temporary until wellness reads the user's timezone / water goal from auth-service.
wellness:
  default-timezone: ${WELLNESS_DEFAULT_TIMEZONE:Africa/Casablanca}
  default-water-goal-ml: ${WELLNESS_DEFAULT_WATER_GOAL_ML:2000}

ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8090}
  connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${AI_READ_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: wellness-service
    description: ENTWIN Digital Life Twin Wellness Service
    version: 0.1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.digitallifetwin.wellness: INFO
    org.springframework.security: INFO
