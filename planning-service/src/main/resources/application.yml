spring:
  application:
    name: planning-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PLANNING_DB_NAME:dlt_planning}
    username: ${DB_USERNAME:dlt}
    password: ${DB_PASSWORD:dlt}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8082}

# Must match auth-service JWT_SECRET so access tokens verify correctly.
jwt:
  secret: ${JWT_SECRET:LocalDevOnlyChangeMe_NeedAtLeast32Bytes!!}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Temporary until planning reads the user's timezone from auth-service.
planning:
  default-timezone: ${PLANNING_DEFAULT_TIMEZONE:Africa/Casablanca}
  day-start: ${PLANNING_DAY_START:08:00}
  day-end: ${PLANNING_DAY_END:23:00}
  overload-threshold-ratio: ${PLANNING_OVERLOAD_THRESHOLD:0.9}

ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8090}
  connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${AI_READ_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: planning-service
    description: ENTWIN Digital Life Twin Planning Service
    version: 0.1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.digitallifetwin.planning: INFO
    org.springframework.security: INFO
