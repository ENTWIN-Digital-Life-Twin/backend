name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test all services
        run: ./mvnw -pl auth-service,planning-service,wellness-service -am package -DskipTests -B

      - name: Build Docker images
        run: |
          docker build -f auth-service/Dockerfile -t entwin-auth-service .
          docker build -f planning-service/Dockerfile -t entwin-planning-service .
          docker build -f wellness-service/Dockerfile -t entwin-wellness-service .

      - name: Run Trivy vulnerability scanner (auth-service)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: entwin-auth-service
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Run Trivy vulnerability scanner (planning-service)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: entwin-planning-service
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Run Trivy vulnerability scanner (wellness-service)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: entwin-wellness-service
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/backend
            git pull origin main
            docker compose down
            docker compose up -d --build

  zap-scan:
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for services to be ready
        run: sleep 30

      - name: ZAP Baseline Scan - auth-service
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://${{ secrets.EC2_HOST }}:8081'
          cmd_options: '-a'
          fail_action: false
          allow_issue_writing: false

      - name: ZAP Baseline Scan - planning-service
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://${{ secrets.EC2_HOST }}:8082'
          cmd_options: '-a'
          fail_action: false
          allow_issue_writing: false

      - name: ZAP Baseline Scan - wellness-service
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://${{ secrets.EC2_HOST }}:8083'
          cmd_options: '-a'
          fail_action: false
          allow_issue_writing: false
