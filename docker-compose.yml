services:
  dlt-postgres:
    image: postgres:16-alpine
    container_name: dlt-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-dlt_auth}
      POSTGRES_USER: ${DB_USERNAME:-dlt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dlt}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dlt_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dlt} -d ${DB_NAME:-dlt_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlt-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: dlt-api-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-LocalDevOnlyChangeMe_NeedAtLeast32Bytes!!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      PLANNING_SERVICE_URL: ${PLANNING_SERVICE_URL:-http://planning-service:8082}
      WELLNESS_SERVICE_URL: ${WELLNESS_SERVICE_URL:-http://wellness-service:8083}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8084}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8090}
      GATEWAY_AUTH_RATE_LIMIT_REQUESTS: ${GATEWAY_AUTH_RATE_LIMIT_REQUESTS:-20}
      GATEWAY_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
    networks:
      - dlt-net

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    environment:
      DB_HOST: dlt-postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dlt_auth}
      DB_USERNAME: ${DB_USERNAME:-dlt}
      DB_PASSWORD: ${DB_PASSWORD:-dlt}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      dlt-postgres:
        condition: service_healthy
    networks:
      - dlt-net

  planning-service:
    build:
      context: .
      dockerfile: planning-service/Dockerfile
    container_name: planning-service
    environment:
      DB_HOST: dlt-postgres
      DB_PORT: 5432
      DB_NAME: ${PLANNING_DB_NAME:-dlt_planning}
      DB_USERNAME: ${DB_USERNAME:-dlt}
      DB_PASSWORD: ${DB_PASSWORD:-dlt}
      JWT_SECRET: ${JWT_SECRET}
      PLANNING_DEFAULT_TIMEZONE: ${PLANNING_DEFAULT_TIMEZONE}
      PLANNING_DAY_START: ${PLANNING_DAY_START}
      PLANNING_DAY_END: ${PLANNING_DAY_END}
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      dlt-postgres:
        condition: service_healthy
    networks:
      - dlt-net

  wellness-service:
    build:
      context: .
      dockerfile: wellness-service/Dockerfile
    container_name: wellness-service
    environment:
      DB_HOST: dlt-postgres
      DB_PORT: 5432
      DB_NAME: ${WELLNESS_DB_NAME:-dlt_wellness}
      DB_USERNAME: ${DB_USERNAME:-dlt}
      DB_PASSWORD: ${DB_PASSWORD:-dlt}
      JWT_SECRET: ${JWT_SECRET}
      WELLNESS_DEFAULT_TIMEZONE: ${WELLNESS_DEFAULT_TIMEZONE}
      WELLNESS_DEFAULT_WATER_GOAL_ML: ${WELLNESS_DEFAULT_WATER_GOAL_ML}
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      dlt-postgres:
        condition: service_healthy
    networks:
      - dlt-net

networks:
  dlt-net:
    driver: bridge

volumes:
  dlt_postgres_data:
