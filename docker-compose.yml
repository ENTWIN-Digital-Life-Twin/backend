services:
  dlt-postgres:
    image: postgres:16-alpine
    container_name: dlt-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-dlt_auth}
      POSTGRES_USER: ${DB_USERNAME:-dlt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dlt}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dlt_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dlt} -d ${DB_NAME:-dlt_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlt-net

  # Edge entry point. Downstream services must join `dlt-net` and use these Docker DNS names.
  # Local non-Docker defaults remain localhost in application.yml / .env.example.
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: dlt-api-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-LocalDevOnlyChangeMe_NeedAtLeast32Bytes!!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      PLANNING_SERVICE_URL: ${PLANNING_SERVICE_URL:-http://planning-service:8082}
      WELLNESS_SERVICE_URL: ${WELLNESS_SERVICE_URL:-http://wellness-service:8083}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8084}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8090}
      GATEWAY_AUTH_RATE_LIMIT_REQUESTS: ${GATEWAY_AUTH_RATE_LIMIT_REQUESTS:-20}
      GATEWAY_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
    networks:
      - dlt-net

networks:
  dlt-net:
    driver: bridge

volumes:
  dlt_postgres_data:
