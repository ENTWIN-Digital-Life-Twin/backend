spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dlt_auth}
    username: ${DB_USERNAME:dlt}
    password: ${DB_PASSWORD:dlt}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8081}

# Override JWT_SECRET in every non-local environment.
# The fallback value is a local-development placeholder, not a production secret.
jwt:
  secret: ${JWT_SECRET:LocalDevOnlyChangeMe_NeedAtLeast32Bytes!!}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

# Local default true so the forgot-password UI can continue without SMTP.
# Set AUTH_EXPOSE_RESET_TOKEN=false in any shared or production environment.
auth:
  expose-reset-token: ${AUTH_EXPOSE_RESET_TOKEN:true}
  reset-expiration-seconds: ${AUTH_RESET_EXPIRATION_SECONDS:3600}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail-from: ${MAIL_FROM:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

info:
  app:
    name: auth-service
    description: ENTWIN Digital Life Twin Authentication Service
    version: 0.1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.digitallifetwin.auth: INFO
    org.springframework.security: INFO
