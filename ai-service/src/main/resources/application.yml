spring:
  application:
    name: ai-service

server:
  port: ${SERVER_PORT:8091}

# Must match auth-service JWT_SECRET so access tokens verify correctly.
jwt:
  secret: ${JWT_SECRET:LocalDevOnlyChangeMe_NeedAtLeast32Bytes!!}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

downstream:
  planning-service-url: ${PLANNING_SERVICE_URL:http://localhost:8082}
  wellness-service-url: ${WELLNESS_SERVICE_URL:http://localhost:8083}
  connect-timeout-ms: ${AI_DOWNSTREAM_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${AI_DOWNSTREAM_READ_TIMEOUT_MS:4000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ai-service
    description: ENTWIN Digital Life Twin rule-based AI insights service
    version: 0.1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.digitallifetwin.ai: INFO
    org.springframework.security: INFO
